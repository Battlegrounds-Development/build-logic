name: Code Quality / Lint

on:
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Run Checkstyle / Lint
        run: ./gradlew check || echo "No check task configured"
      - name: AI Notice
        run: echo "🤖 Checked by AI (opencode)."
