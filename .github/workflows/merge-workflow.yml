name: Merge Workflow (Snapshot / Dev Publish)

on:
  push:
    branches: [ "main", "master" ]

jobs:
  snapshot-build-and-publish:
    name: Build, Mojang Re-obfuscate & Publish Snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Generate Timestamped Snapshot Tag
        id: timestamp
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          VERSION_TAG="snapshot-${TIMESTAMP}-${COMMIT_SHA}"
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "Generated version tag: ${VERSION_TAG}"

      - name: Run Paperweight Mojang Re-obfuscation & Gradle Build
        run: |
          # Paperweight re-obfuscation task or standard gradle build
          ./gradlew build reobfJar || ./gradlew build

      - name: Extract PR / Commit Metadata for Release Notes
        id: metadata
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          AUTHOR=$(git log -1 --pretty=%an)
          echo "body=### Development Snapshot Build\n- **Commit Message:** ${COMMIT_MSG}\n- **Author:** ${AUTHOR}\n- **Timestamp:** $(date -u)" >> $GITHUB_OUTPUT

      - name: Publish Pre-release / Developmental Snapshot Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.timestamp.outputs.version_tag }}
          name: "Development Snapshot (${{ steps.timestamp.outputs.version_tag }})"
          body: ${{ steps.metadata.outputs.body }}
          prerelease: true
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Artifactory / Package Registry
        run: |
          ./gradlew publish || echo "Publish task not configured or skipped"
        env:
          ORG_GRADLE_PROJECT_artifactoryUrl: ${{ secrets.ARTIFACTORY_URL }}
          ORG_GRADLE_PROJECT_artifactoryUser: ${{ secrets.ARTIFACTORY_USER }}
          ORG_GRADLE_PROJECT_artifactoryPassword: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Upload Final Test Baseline Trends
        uses: actions/upload-artifact@v4
        with:
          name: test-results-baseline-${{ steps.timestamp.outputs.version_tag }}
          path: build/test-results/**/*.xml

      - name: AI Notice
        run: echo "🤖 Merge Workflow executed successfully by AI (opencode)."
